/* ============ 对局记录 ============ */
function renderHistory(){
  const box=$("hist-list");
  if(!historyList.length){ box.innerHTML='<div class="muted" style="text-align:center;padding:40px 0;">还没有对局记录</div>'; return; }
  box.innerHTML=historyList.map(h=>{
    const wt={good:"好人阵营获胜",wolf:"狼人阵营获胜",third:"第三方阵营获胜",draw:"平局"}[h.result]||"平局";
    const ic={good:"sun",wolf:"wolf",third:"bow",draw:"check"}[h.result]||"trophy";
    const d=new Date(h.endTime);
    const p=h.snapshot&&h.snapshot.players||[];
    return `<div class="hist-item" data-id="${h.id}">
      <div class="row"><span class="ic" data-icon="${ic}"></span><b>${wt}</b><span class="grow"></span><span class="muted">${h.mode==="play"?"参与":"观战"}</span></div>
      <div class="tags">${h.playerCount}人局 · ${p.length?p.map(x=>ROLES[x.role]?ROLES[x.role].name:x.role).join(" / "):""}</div>
      <div class="tags">${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</div>
    </div>`;
  }).join("");
  box.querySelectorAll(".hist-item").forEach(el=>{
    el.onclick=()=>{ const h=historyList.find(x=>x.id===el.dataset.id); if(h&&h.snapshot) startReplay(h.snapshot.history, h.snapshot.players, h.snapshot.playerCount, h.snapshot.winner); };
    el.oncontextmenu=e=>{ e.preventDefault(); deleteHistoryItem(el.dataset.id); };
  });
  paintIcons($("screen-history"));
}
function deleteHistoryItem(id){
  confirmBox("删除记录","删除该对局记录？",()=>{ historyList=historyList.filter(x=>x.id!==id); saveHistory(); renderHistory(); },true);
}

/* ============ 新手引导 ============ */
let obIdx=0;
function showOnboard(){
  renderOnboard(); showScreen("screen-onboard");
}
function renderOnboard(){
  const cards=[
    {icon:"user",title:"两种模式",text:"参与对局：你占一个席位，亲自发言、投票、用技能；观战上帝：全 AI 对局，逐步推进，全信息可见。"},
    {icon:"archive",title:"角色档案",text:"创建你的 AI 角色，AI 可帮你生成性格；开局时从档案挑选演员入座。"},
    {icon:"sparkle",title:"思考展示",text:"带思考能力的模型会显示推理过程，点开即看 AI 的心理活动。"}
  ];
  const c=cards[obIdx];
  $("ob-body").innerHTML=`<div class="onboard-card"><span class="ic" data-icon="${c.icon}"></span><div class="title-serif" style="font-size:24px;">${c.title}</div><div class="muted" style="margin-top:12px;font-size:14px;">${c.text}</div></div>
    <div class="steps-dots">${[0,1,2].map(i=>`<i class="${i===obIdx?'on':''}"></i>`).join("")}</div>`;
  paintIcons($("screen-onboard"));
  $("ob-next").textContent = obIdx===2? "开始使用":"下一步";
}

/* ============ 六步开局向导 ============ */
const ADV_TYPES={witchSelfRescue:"s",sameGuardSave:"s",guardSelf:"b",seerSelf:"b",wolfKingAfterBoom:"s",idiotTwice:"s",hunterGiveUp:"b",tieBreak:"s",forceDrawDays:"n",firstSpeakerRandom:"b",wolfDiscussRounds:"n"};
const ROLE_GROUPS=[
  {label:"狼人阵营",keys:["wolf","white_wolf_king","hidden_wolf"]},
  {label:"神职",keys:["seer","witch","hunter","guard","idiot","cupid","bomber"]},
  {label:"平民",keys:["villager"]}
];
let wz=null;
function defaultAdvanced(){
  return {witchSelfRescue:"none",sameGuardSave:"alive",guardSelf:false,seerSelf:false,wolfKingAfterBoom:"continue",idiotTwice:"death",hunterGiveUp:true,tieBreak:"pk",forceDrawDays:30,firstSpeakerRandom:false,wolfDiscussRounds:1};
}
function initWizard(){
  wz={step:0,mode:"play",playerCount:8,roleCounts:{},seats:[],advanced:defaultAdvanced()};
  ROLE_BOARD_ORDER.forEach(k=>wz.roleCounts[k]=0);
  BOARDS[8].roles.forEach(r=>wz.roleCounts[r]=(wz.roleCounts[r]||0)+1);
  initSeats();
  showScreen("screen-wizard");
  renderWizard();
}
function initSeats(){
  wz.seats=[];
  for(let i=1;i<=wz.playerCount;i++) wz.seats.push({seat:i,charId:(wz.mode==="play"&&i===1)?"user":null,role:null});
}
function loadBoard(n){
  wz.playerCount=n;
  ROLE_BOARD_ORDER.forEach(k=>wz.roleCounts[k]=0);
  BOARDS[n].roles.forEach(r=>wz.roleCounts[r]=(wz.roleCounts[r]||0)+1);
  initSeats();
}
function boardTotal(){ return ROLE_BOARD_ORDER.reduce((a,k)=>a+(wz.roleCounts[k]||0),0); }
function boardWolves(){ return (wz.roleCounts.wolf||0)+(wz.roleCounts.white_wolf_king||0)+(wz.roleCounts.hidden_wolf||0); }
function boardHTML(){
  let html="";
  ROLE_GROUPS.forEach(g=>{
    html+=`<div class="group-label">${g.label}</div>`;
    g.keys.forEach(k=>{
      const r=ROLES[k];
      html+=`<div class="role-count">${icon(r.icon,"sm")}<span class="nm">${r.name}</span>
        <div class="stepper"><button data-role="${k}" data-d="-1">-</button><span class="n">${wz.roleCounts[k]||0}</span><button data-role="${k}" data-d="1">+</button></div></div>`;
    });
  });
  const t=boardTotal(), w=boardWolves(), v=wz.roleCounts.villager||0, gods=t-w-v;
  let warn;
  if(t!==wz.playerCount) warn=`<div class="muted" style="color:var(--red);margin-top:10px;">角色总数 ${t} 不等于人数 ${wz.playerCount}</div>`;
  else if(w<1||v<1) warn=`<div class="muted" style="color:var(--red);margin-top:10px;">需满足：狼人 ≥ 1 且 平民 ≥ 1</div>`;
  else warn=`<div class="muted" style="margin-top:10px;">狼 ${w} · 神 ${gods} · 民 ${v} · 共 ${t} 人</div>`;
  return html+warn;
}
function roleOptions(cur){
  let opts='<option value="">随机发牌</option>';
  ROLE_BOARD_ORDER.forEach(k=>{ if((wz.roleCounts[k]||0)>0) opts+=`<option value="${k}" ${cur===k?"selected":""}>${ROLES[k].name}</option>`; });
  return opts;
}
function characterOptions(charId, seat){
  const used=new Set(wz.seats.filter(s=>s.charId&&s.charId!=="user"&&s.seat!==seat).map(s=>s.charId));
  let opts='<option value="">待分配（临时补位）</option>';
  characters.forEach(c=>{ opts+=`<option value="${c.id}" ${charId===c.id?"selected":""} ${used.has(c.id)?"disabled":""}>${esc(c.name)}</option>`; });
  return `<select data-seat="${seat}" data-k="char" style="max-width:130px;">${opts}</select>`;
}
function seatsHTML(){
  let html="";
  wz.seats.forEach(s=>{
    if(wz.mode==="play"&&s.seat===1){
      html+=`<div class="seat-row"><span class="tag">席位1</span><div class="seat-av">${settings.user.avatar?'<img src="'+settings.user.avatar+'">':icon("user")}</div><span style="flex:1;font-size:13px;">我（用户）</span><select data-seat="${s.seat}" data-k="role" style="width:auto;max-width:150px;">${roleOptions(s.role)}</select></div>`;
    } else {
      html+=`<div class="seat-row"><span class="tag">席位${s.seat}</span>${characterOptions(s.charId,s.seat)}<select data-seat="${s.seat}" data-k="role" style="width:auto;max-width:150px;">${roleOptions(s.role)}</select></div>`;
    }
  });
  html+=`<div class="row mt16"><button class="btn small" id="seat-random-all">随机填满全部</button><button class="btn small" id="seat-random-empty">仅填空席</button></div>`;
  return html;
}
function randomFill(emptyOnly){
  const used=new Set(wz.seats.filter(s=>s.charId&&s.charId!=="user").map(s=>s.charId));
  const avail=characters.filter(c=>!used.has(c.id)).map(c=>c.id);
  wz.seats.forEach(s=>{
    if(wz.mode==="play"&&s.seat===1) return;
    if(emptyOnly&&s.charId) return;
    if(avail.length) s.charId=avail.shift(); else s.charId=null;
  });
}
function advRow(label,key,options){
  const cur=String(wz.advanced[key]);
  return `<div class="row mt8"><span class="grow" style="font-size:13px;">${label}</span><select data-adv="${key}" style="width:auto;">${options.map(o=>`<option value="${o[0]}" ${cur===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div>`;
}
function advancedHTML(){
  return `<div class="card">
    ${advRow("女巫自救","witchSelfRescue",[["none","不能自救"],["first","仅第一夜自救"],["all","全程可自救"]])}
    ${advRow("同守同救","sameGuardSave",[["alive","= 活"],["dead","= 死（赛事规则）"]])}
    ${advRow("守卫自守","guardSelf",[["false","不能自守"],["true","可以自守"]])}
    ${advRow("预言家查自己","seerSelf",[["false","不能"],["true","能（恒好人）"]])}
    ${advRow("白狼王自爆后","wolfKingAfterBoom",[["continue","继续发言"],["vote","直接投票"]])}
    ${advRow("白痴二次放逐","idiotTwice",[["death","正常死亡"],["immune","永久免疫"]])}
    ${advRow("猎人放弃开枪","hunterGiveUp",[["true","可放弃"],["false","必须开枪"]])}
    ${advRow("平票处理","tieBreak",[["pk","PK 一轮"],["none","直接无放逐"],["random","随机放逐"]])}
    ${advRow("首日发言起点","firstSpeakerRandom",[["false","1 号开始"],["true","随机"]])}
    ${advRow("狼队讨论轮数","wolfDiscussRounds",[["1","1 轮"],["2","2 轮"]])}
    ${advRow("强制平局天数","forceDrawDays",[["20","20 天"],["30","30 天"],["40","40 天"]])}
  </div><div class="muted mt8">一般无需改动，保持默认即可。</div>`;
}
function summaryHTML(){
  const roles=[]; ROLE_BOARD_ORDER.forEach(k=>{ for(let i=0;i<(wz.roleCounts[k]||0);i++) roles.push(k); });
  const rstr=roles.map(r=>ROLES[r].name).join("、");
  let seatPre="";
  wz.seats.forEach(s=>{ const nm=s.charId==="user"?"我":(s.charId?(characters.find(c=>c.id===s.charId)||{}).name||"临时":"临时补位"); seatPre+=`<span class="muted" style="margin-right:6px;">${s.seat}号·${esc(nm)}</span>`; });
  const est=Math.round(wz.playerCount*30);
  return `<div class="card"><div class="muted">模式</div><b>${wz.mode==="play"?"参与对局（我占 1 个席位）":"观战上帝（全 AI）"}</b></div>
  <div class="card mt8"><div class="muted">人数</div><b>${wz.playerCount} 人局 · ${BOARDS[wz.playerCount].name}</b></div>
  <div class="card mt8"><div class="muted">板子构成</div><div style="font-size:13px;">${rstr}</div></div>
  <div class="card mt8"><div class="muted">席位</div><div style="font-size:12px;">${seatPre}</div></div>
  <div class="card mt8"><div class="muted">估算</div><div style="font-size:13px;">本局预计约 ${est} 次 API 调用（±30%）</div></div>`;
}
function renderWizard(){
  if(!wz) return;
  const titles=["选择模式","选择人数","板子配置","席位分配","高级规则","开局确认"];
  $("wz-title").textContent=titles[wz.step]; $("wz-step-ind").textContent=`${wz.step+1}/6`;
  $("wz-dots").innerHTML=[0,1,2,3,4,5].map(i=>`<i class="${i===wz.step?'on':''}"></i>`).join("");
  const body=$("wz-body");
  if(wz.step===0){
    body.innerHTML=`<div class="opt-card ${wz.mode==="play"?'on':''}" data-mode="play"><span class="ic" data-icon="user"></span><div><b>参与对局</b><div class="muted">你占一个席位，亲自发言、投票、用技能。</div></div></div>
      <div class="opt-card ${wz.mode==="spectate"?'on':''}" data-mode="spectate"><span class="ic" data-icon="eye"></span><div><b>观战上帝</b><div class="muted">全 AI 对局，逐步推进，全信息可见。</div></div></div>`;
    body.querySelectorAll(".opt-card").forEach(o=>o.onclick=()=>{ wz.mode=o.dataset.mode; initSeats(); renderWizard(); });
  } else if(wz.step===1){
    body.innerHTML=`<div class="num-opt">${[6,8,9,10,12].map(n=>`<div class="opt ${wz.playerCount===n?'on':''}" data-n="${n}"><b>${n}人</b><div class="muted" style="font-size:11px;">${BOARDS[n].name}</div></div>`).join("")}</div>
      <div class="muted mt16">参与模式下席位总数包含你本人。</div>`;
    body.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ loadBoard(parseInt(o.dataset.n)); renderWizard(); });
  } else if(wz.step===2){
    body.innerHTML=`<div class="card">${boardHTML()}</div>`;
    body.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{ const k=b.dataset.role,d=parseInt(b.dataset.d); wz.roleCounts[k]=(wz.roleCounts[k]||0)+d; if(wz.roleCounts[k]<0)wz.roleCounts[k]=0; renderWizard(); });
  } else if(wz.step===3){
    body.innerHTML=`<div class="card">${seatsHTML()}</div>`;
    body.querySelectorAll("select[data-k='char']").forEach(sel=>sel.onchange=()=>{ const s=wz.seats.find(x=>x.seat===parseInt(sel.dataset.seat)); if(s) s.charId=sel.value||null; });
    body.querySelectorAll("select[data-k='role']").forEach(sel=>sel.onchange=()=>{ const s=wz.seats.find(x=>x.seat===parseInt(sel.dataset.seat)); if(s) s.role=sel.value||null; });
    const ra=$("seat-random-all"); if(ra) ra.onclick=()=>{ randomFill(false); renderWizard(); };
    const re=$("seat-random-empty"); if(re) re.onclick=()=>{ randomFill(true); renderWizard(); };
  } else if(wz.step===4){
    body.innerHTML=advancedHTML();
    body.querySelectorAll("[data-adv]").forEach(sel=>sel.onchange=()=>{ const k=sel.dataset.adv,t=ADV_TYPES[k],v=sel.value; wz.advanced[k]=t==="b"?v==="true":(t==="n"?parseInt(v):v); });
  } else if(wz.step===5){
    body.innerHTML=summaryHTML();
  }
  $("wz-next").textContent = wz.step===5? "开始对局":"下一步";
  $("wz-prev").textContent = wz.step===0? "返回":"上一步";
  paintIcons(body);
}
function checkStartAPI(){
  if(!settings.globalAPI.apiKey){
    const assigned=wz.seats.filter(s=>s.charId&&s.charId!=="user").map(s=>characters.find(c=>c.id===s.charId)).filter(Boolean);
    const hasCustom=assigned.length===wz.playerCount-1 && assigned.every(c=>c.apiMode==="custom"&&c.apiConfig&&c.apiConfig.apiKey);
    if(!hasCustom){
      confirmBox("未配置 API","本局 AI 将全部由法官随机代打。可先到「设置」配置 API。确定继续本局？",()=>startWizardGame());
      return false;
    }
  }
  return true;
}
function startWizardGame(){
  const roles=[]; ROLE_BOARD_ORDER.forEach(k=>{ for(let i=0;i<(wz.roleCounts[k]||0);i++) roles.push(k); });
  const seatAssign=wz.seats.map(s=>({seat:s.seat,charId:s.charId,role:s.role||null}));
  const cfg={mode:wz.mode,playerCount:wz.playerCount,roles,seatAssign,userSeat:wz.mode==="play"?1:null,advanced:wz.advanced};
  startGame(cfg);
}
function onWizardNext(){
  if(wz.step===2){ const t=boardTotal(),w=boardWolves(),v=wz.roleCounts.villager||0; if(t!==wz.playerCount||w<1||v<1){ toast("板子校验失败：总数等于人数，狼人≥1，平民≥1"); return; } }
  if(wz.step===5){ if(!checkStartAPI()) return; startWizardGame(); return; }
  wz.step++; renderWizard();
}

/* ============ 初始化 ============ */
function init(){
  renderSprite();
  paintIcons(document);
  loadSettingsForm();
  bindSettings();
  // 首页
  $("btn-characters").onclick=()=>{ renderCharList(); showScreen("screen-characters"); };
  $("btn-start").onclick=()=>{ if(hasSave()&&!game){ confirmBox("开始新对局","将覆盖未完成的对局，是否继续？",()=>initWizard()); } else initWizard(); };
  $("btn-settings").onclick=()=>{ loadSettingsForm(); showScreen("screen-settings"); };
  $("link-history").onclick=()=>{ renderHistory(); showScreen("screen-history"); };
  $("link-rules").onclick=showRules;
  // 档案
  $("ch-back").onclick=()=>{ showScreen("screen-home"); renderHome(); };
  $("ch-add").onclick=()=>openCharEdit(null);
  $("ch-add2").onclick=()=>openCharEdit(null);
  $("ce-back").onclick=()=>{ showScreen("screen-characters"); renderCharList(); };
  $("ce-save").onclick=saveChar;
  $("ce-generate").onclick=generateCharacter;
  $("ce-avatar").onclick=()=>$("ce-file").click();
  $("ce-file").onchange=async e=>{ const u=await resizeImage(e.target.files[0]); if(u){ $("ce-avatar").innerHTML=`<img src="${u}">`; } };
  $("ce-personality").oninput=()=>$("ce-pcount").textContent=$("ce-personality").value.length;
  $("ce-test").onclick=()=>testConnection($("ce-baseurl").value.trim(),$("ce-apikey").value.trim(),$("ce-model").value.trim(),$("ce-testresult"));
  document.addEventListener("change",e=>{ if(e.target&&e.target.name==="apimode") $("ce-apicfg").classList.toggle("hidden",e.target.value!=="custom"); });
  // 设置
  $("st-back").onclick=()=>{ showScreen("screen-home"); renderHome(); };
  // 向导
  $("wz-back").onclick=()=>{ showScreen("screen-home"); renderHome(); };
  $("wz-prev").onclick=()=>{ if(wz.step===0){ showScreen("screen-home"); renderHome(); } else { wz.step--; renderWizard(); } };
  $("wz-next").onclick=onWizardNext;
  // 局内
  $("game-menu").onclick=openGameMenu;
  $("game-view").onchange=()=>{ currentView=$("game-view").value; renderEventStream(); };
  // 记录/规则
  $("his-back").onclick=()=>{ showScreen("screen-home"); renderHome(); };
  $("ru-back").onclick=()=>{ if(game) showScreen("screen-game"); else { showScreen("screen-home"); renderHome(); } };
  // 新手引导
  $("ob-next").onclick=()=>{ obIdx++; if(obIdx>=3){ settings.onboarded=true; saveSettings(); showScreen("screen-home"); renderHome(); } else renderOnboard(); };
  $("ob-skip").onclick=()=>{ settings.onboarded=true; saveSettings(); showScreen("screen-home"); renderHome(); };

  renderHome();
  if(!settings.onboarded){ showOnboard(); } else { showScreen("screen-home"); }
}
init();
</script>
