<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI狼人杀</title>
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#2a2f3a;
  --txt:#e8e6e3; --sub:#8a8f98; --gold:#e3b34c; --red:#c0453e;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --r:12px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;
  padding-top:calc(12px + var(--safe-top)); padding-bottom:calc(16px + var(--safe-bottom));}
.screen{display:none;padding:0 16px;animation:fade .15s ease;}
.screen.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.hidden{display:none!important;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:15px;}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--txt);background:var(--card2);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--gold);}
textarea{resize:vertical;min-height:90px;}
label{font-size:12px;color:var(--sub);display:block;margin:14px 0 6px;}
a{color:var(--gold);text-decoration:none;}

/* ===== 通用组件 ===== */
.ic{width:20px;height:20px;flex:none;}
.ic.sm{width:16px;height:16px;}
.ic.lg{width:24px;height:24px;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;
  border-radius:10px;color:var(--sub);}
.icon-btn:active{background:var(--card2);}
.btn{display:flex;align-items:center;gap:8px;justify-content:center;width:100%;
  padding:13px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  color:var(--txt);font-size:15px;}
.btn:active{opacity:.8;}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#181512;font-weight:600;}
.btn.ghost{background:transparent;color:var(--sub);}
.btn.danger{color:var(--red);border-color:var(--red);}
.btn.small{width:auto;padding:7px 14px;font-size:13px;}
.btn:disabled{opacity:.4;pointer-events:none;}
.row{display:flex;align-items:center;gap:10px;}
.grow{flex:1;}
.mt8{margin-top:8px;} .mt16{margin-top:16px;} .mt24{margin-top:24px;}
.muted{color:var(--sub);font-size:12px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.hr{height:1px;background:var(--line);margin:0;border:none;}

/* 标题艺术字 */
.title-serif{font-family:"Songti SC","STZhongsong","Noto Serif CJK SC","SimSun",serif;
  font-size:32px;font-weight:700;letter-spacing:2px;
  text-shadow:2px 2px 0 #000, 5px 5px 0 rgba(227,179,76,.18);}
.subtitle{font-size:12px;color:var(--sub);margin-top:4px;}

/* ===== 首页 ===== */
.home-hero{text-align:center;padding:28px 0 18px;}
.home-hero .title-serif{font-size:34px;}
.home-actions{margin-top:16px;}
.home-actions .btn{margin-bottom:10px;}
.home-links{display:flex;justify-content:center;gap:24px;margin-top:20px;font-size:13px;color:var(--sub);}

/* ===== 档案 ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.char-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;
  position:relative;cursor:pointer;}
.char-card:active{opacity:.85;}
.char-card .av{width:48px;height:48px;border-radius:50%;background:var(--card2);overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:var(--sub);border:1px solid var(--line);}
.char-card .av img{width:100%;height:100%;object-fit:cover;display:block;}
.char-card .nm{font-weight:600;margin-top:8px;font-size:14px;}
.char-card .pd{font-size:12px;color:var(--sub);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;
  -webkit-box-orient:vertical;overflow:hidden;min-height:18px;}
.char-card .meta{font-size:11px;color:var(--sub);margin-top:6px;}
.badge{position:absolute;top:8px;left:8px;font-size:10px;background:var(--gold);color:#181512;
  padding:1px 6px;border-radius:4px;font-weight:600;}
.badge.tmp{background:var(--red);color:#fff;}
.fab{position:fixed;bottom:calc(20px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  max-width:440px;width:calc(100% - 32px);}

/* 头像上传 */
.avatar-upload{width:96px;height:96px;border-radius:50%;background:var(--card2);border:1px dashed var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sub);
  cursor:pointer;overflow:hidden;position:relative;margin:0 auto;}
.avatar-upload img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}

/* 开关 */
.switch{position:relative;width:44px;height:26px;flex:none;}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2;}
.switch .track{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:20px;transition:.15s;}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:var(--sub);
  border-radius:50%;transition:.15s;}
.switch input:checked + .track{background:var(--gold);border-color:var(--gold);}
.switch input:checked + .track::after{left:22px;background:#181512;}

/* 向导 */
.steps-dots{display:flex;gap:6px;justify-content:center;margin:14px 0;}
.steps-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:.2s;}
.steps-dots i.on{background:var(--gold);width:20px;border-radius:6px;}
.wizard-nav{display:flex;gap:10px;margin-top:20px;}
.opt-card{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--card);margin-bottom:10px;cursor:pointer;}
.opt-card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
.opt-card .ic{color:var(--gold);}
.num-opt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.num-opt .opt{padding:14px 8px;text-align:center;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer;}
.num-opt .opt.on{border-color:var(--gold);color:var(--gold);}
.role-count{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);}
.role-count .ic{color:var(--gold);}
.role-count .nm{flex:1;font-size:14px;}
.stepper{display:flex;align-items:center;gap:10px;}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;color:var(--sub);}
.stepper .n{min-width:22px;text-align:center;font-weight:600;}
.seat-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);}
.seat-row .tag{font-size:12px;color:var(--sub);width:44px;flex:none;}
.seat-row select{width:auto;flex:1;min-width:0;font-size:13px;padding:7px 8px;}
.seat-av{width:26px;height:26px;border-radius:50%;overflow:hidden;background:var(--card2);flex:none;
  display:flex;align-items:center;justify-content:center;color:var(--sub);}
.seat-av img{width:100%;height:100%;object-fit:cover;}
.group-label{font-size:12px;color:var(--gold);margin:16px 0 6px;}

/* 局内 */
#screen-game{padding:0 8px;}
.game-topbar{display:flex;align-items:center;gap:8px;padding:8px 4px;position:sticky;top:0;background:var(--bg);z-index:5;}
.game-topbar .phase-tag{display:flex;align-items:center;gap:6px;font-weight:600;}
.game-topbar .alive{font-size:12px;color:var(--sub);}
.game-topbar select{width:auto;padding:5px 6px;font-size:12px;background:var(--card);}
.table-wrap{position:relative;width:100%;aspect-ratio:1/1;max-height:46vh;margin:0 auto;}
.table-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
  width:44%;max-width:180px;}
.table-center .ct{font-size:13px;color:var(--sub);}
.table-center .cv{font-size:15px;font-weight:600;margin-top:3px;}
.seat{position:absolute;transform:translate(-50%,-50%);width:64px;text-align:center;cursor:pointer;}
.seat .avwrap{position:relative;width:40px;height:40px;margin:0 auto;}
.seat .av{width:40px;height:40px;border-radius:50%;background:var(--card2);border:2px solid var(--line);
  overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--sub);}
.seat .av img{width:100%;height:100%;object-fit:cover;}
.seat .num{position:absolute;top:-6px;left:-6px;background:var(--bg);border:1px solid var(--line);
  border-radius:50%;width:18px;height:18px;font-size:10px;line-height:16px;text-align:center;color:var(--sub);}
.seat .nm{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:62px;}
.seat .sk{position:absolute;right:-6px;bottom:-2px;width:14px;height:14px;color:#888;}
.seat.dead{opacity:.45;}
.seat.dead .av{border-color:var(--line);}
.seat .av img{filter:grayscale(0);}
.seat.dead .av img{filter:grayscale(1);}
.seat.user .av{border-color:var(--gold);}
.seat.active .av{border-color:var(--gold);box-shadow:0 0 0 2px rgba(227,179,76,.4);}
.seat.speaking .av{border-color:var(--gold);box-shadow:0 0 0 2px rgba(227,179,76,.4);}
.night-dim{position:fixed;inset:0;background:rgba(0,0,0,.55);pointer-events:none;z-index:1;transition:.3s;}

/* 事件流 */
.event-stream{height:33vh;overflow-y:auto;margin-top:8px;padding:2px 4px;border-top:1px solid var(--line);}
.event-scroll{display:flex;flex-direction:column;gap:8px;padding:10px 0;}
.step-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:14px;animation:fade .15s ease;}
.step-card.system{background:transparent;border:none;text-align:center;color:var(--sub);font-size:13px;padding:4px;}
.step-card.private{border-style:dashed;border-color:var(--gold);}
.step-card.wolf{border-color:var(--red);}
.step-card.result{border-color:var(--gold);}
.step-card.error{border-color:var(--red);color:var(--red);font-size:13px;}
.step-head{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;margin-bottom:3px;}
.step-head .who{color:var(--txt);font-weight:600;}
.step-head .ic{color:var(--gold);}
.wolf .step-head .ic{color:var(--red);}
.step-body{white-space:pre-wrap;word-break:break-word;}
.step-body.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.step-expand{color:var(--gold);font-size:12px;margin-top:4px;}
.thinking{font-size:12px;color:var(--sub);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);}
.thinking .tt{display:flex;align-items:center;gap:4px;cursor:pointer;color:#7d828c;}
.thinking .tt .ic{width:14px;height:14px;}
.thinking .txt{display:none;margin-top:4px;white-space:pre-wrap;}
.thinking.open .txt{display:block;}
.thinking:not(.open) .txt{display:none;}

/* 操作区 */
.action-bar{position:sticky;bottom:0;background:var(--bg);padding:10px 4px calc(10px + var(--safe-bottom));
  border-top:1px solid var(--line);z-index:5;}
.action-bar .row{gap:8px;}
.action-bar .hint{font-size:12px;color:var(--sub);text-align:center;margin-top:6px;}
.target-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.target-grid .tg{padding:10px 4px;text-align:center;border:1px solid var(--line);border-radius:10px;
  background:var(--card);font-size:13px;cursor:pointer;}
.target-grid .tg:disabled{opacity:.35;cursor:not-allowed;}
.target-grid .tg.on{border-color:var(--gold);color:var(--gold);}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;}
.panel textarea{min-height:70px;}
.char-count{text-align:right;font-size:11px;color:var(--sub);}
.loading-dots::after{content:"";animation:dots 1.2s infinite;}
@keyframes dots{0%{content:"";}33%{content:".";}66%{content:"..";}100%{content:"...";}}

/* 弹层 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;
  align-items:flex-end;justify-content:center;}
.modal-mask.show{display:flex;}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;
  width:100%;max-width:480px;max-height:84vh;overflow-y:auto;padding:16px;animation:up .2s ease;}
@keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:none;opacity:1;}}
.sheet .handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px;}
.center-modal{align-items:center;}
.center-modal .sheet{border-radius:18px;border:1px solid var(--line);max-width:340px;}
.sheet h3{margin:0 0 12px;font-size:17px;}
.sheet .close-x{position:absolute;right:16px;top:16px;color:var(--sub);}

/* 票型 */
.vote-candidate{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:8px;background:var(--card);}
.vote-candidate.winner{border-color:var(--gold);}
.vote-candidate .dots{display:flex;gap:3px;flex-wrap:wrap;}
.vote-candidate .dot{width:9px;height:9px;border-radius:50%;background:var(--sub);}

/* 结算 */
.reveal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
.reveal-card{text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;}
.reveal-card .ic{margin:0 auto;color:var(--gold);}
.reveal-card .rn{font-size:13px;font-weight:600;margin-top:4px;}
.reveal-card .nm{font-size:11px;color:var(--sub);}
.result-banner{text-align:center;padding:20px 0;}
.result-banner .ic{width:40px;height:40px;color:var(--gold);}
.result-banner h2{margin:10px 0 4px;}

/* 记录 */
.hist-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;}
.hist-item .row{gap:8px;}
.hist-item .tags{font-size:12px;color:var(--sub);margin-top:6px;}

/* 新手引导 */
.onboard-card{text-align:center;padding:40px 20px;}
.onboard-card .ic{width:48px;height:48px;color:var(--gold);margin:0 auto 20px;}

/* toast */
#toast{position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:10px 18px;border-radius:20px;
  font-size:13px;z-index:100;display:none;max-width:80%;text-align:center;}

/* 狼队频道 */
.wolf-chat{max-height:200px;overflow-y:auto;margin-bottom:10px;}
.wolf-chat .wc{border:1px solid var(--red);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg" id="sprite"></svg>
<div id="app">

  <!-- 首页 -->
  <section class="screen active" id="screen-home">
    <div class="home-hero">
      <div class="title-serif">AI狼人杀</div>
      <div class="subtitle">本地运行 · 大模型驱动 · 零图片资源</div>
    </div>
    <div class="home-actions">
      <button class="btn" id="btn-characters"><span class="ic" data-icon="archive"></span>角色档案</button>
      <button class="btn primary" id="btn-start"><span class="ic" data-icon="sword"></span>开始游戏</button>
      <button class="btn" id="btn-settings"><span class="ic" data-icon="gear"></span>设置</button>
    </div>
    <div class="home-links">
      <a id="link-history">最近对局</a>
      <a id="link-rules">规则书</a>
    </div>
    <div class="mt16" id="continue-wrap"></div>
  </section>

  <!-- 角色档案列表 -->
  <section class="screen" id="screen-characters">
    <div class="row mt8" style="justify-content:space-between;">
      <button class="icon-btn" id="ch-back"><span class="ic" data-icon="back"></span></button>
      <div><b>角色档案</b><div class="muted" id="ch-capacity"></div></div>
      <button class="icon-btn" id="ch-add"><span class="ic" data-icon="plus"></span></button>
    </div>
    <div class="grid2 mt16" id="char-grid"></div>
    <div class="fab"><button class="btn primary" id="ch-add2"><span class="ic sm" data-icon="plus"></span>创建角色</button></div>
  </section>

  <!-- 角色创建/编辑 -->
  <section class="screen" id="screen-character-edit">
    <div class="row mt8">
      <button class="icon-btn" id="ce-back"><span class="ic" data-icon="back"></span></button>
      <b id="ce-title">创建角色</b>
      <span class="grow"></span>
    </div>
    <div class="mt16">
      <div class="avatar-upload" id="ce-avatar"><span class="ic" data-icon="upload"></span><span class="muted" style="font-size:11px;">上传头像</span></div>
      <label>昵称（2-8 字）</label>
      <input id="ce-name" maxlength="8" placeholder="给角色起个名字">
      <label>性格设定</label>
      <textarea id="ce-personality" placeholder="描述性格与说话方式，80-150字效果最佳"></textarea>
      <div class="char-count"><span id="ce-pcount">0</span>/150</div>
    </div>
    <div class="card mt16">
      <div class="row"><span class="ic" data-icon="sparkle"></span><b>AI 生成</b><span class="grow"></span><button class="btn small" id="ce-generate">生成</button></div>
      <div class="muted mt8">方向标签（可多选，可为空）</div>
      <div id="ce-tags" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;"></div>
    </div>
    <div class="card mt16">
      <b>模型配置</b>
      <div class="mt8" id="ce-apimode"></div>
      <div id="ce-apicfg" class="hidden">
        <label>Base URL</label><input id="ce-baseurl" placeholder="https://api.deepseek.com">
        <label>API Key</label><input id="ce-apikey" type="password" placeholder="sk-...">
        <label>模型名</label><input id="ce-model" placeholder="deepseek-chat">
        <div class="mt8"><button class="btn small" id="ce-test">测试连接</button> <span class="muted" id="ce-testresult"></span></div>
      </div>
    </div>
    <div class="mt16"><button class="btn primary" id="ce-save">保存</button></div>
    <input type="file" id="ce-file" accept="image/*" class="hidden">
  </section>

  <!-- 设置 -->
  <section class="screen" id="screen-settings">
    <div class="row mt8">
      <button class="icon-btn" id="st-back"><span class="ic" data-icon="back"></span></button>
      <b>设置</b>
    </div>
    <div class="card mt16">
      <div class="row"><span class="ic" data-icon="gear"></span><b>全局 API</b></div>
      <label>Base URL（OpenAI 兼容）</label><input id="st-baseurl" placeholder="https://api.deepseek.com">
      <label>API Key</label><div class="row"><input id="st-apikey" type="password" placeholder="sk-..." style="flex:1;"><button class="icon-btn" id="st-keyeye"><span class="ic sm" data-icon="eye"></span></button></div>
      <label>模型名</label><input id="st-model" list="model-presets" placeholder="deepseek-chat">
      <datalist id="model-presets"><option value="deepseek-chat"><option value="deepseek-reasoner"><option value="gpt-4o-mini"><option value="qwen-plus"><option value="moonshot-v1-8k"></datalist>
      <label>Temperature<input id="st-temp" type="range" min="0" max="2" step="0.1" style="width:100%;"></label>
      <div class="muted" id="st-tempval"></div>
      <label>最大 Tokens</label><input id="st-maxtok" type="number" min="100" max="8000" step="100">
      <div class="mt8"><button class="btn small" id="st-test">测试连接</button> <span class="muted" id="st-testresult"></span></div>
      <div class="muted mt8">Key 仅保存在本机浏览器 localStorage，不会上传。</div>
    </div>
    <div class="card mt16">
      <div class="row"><span class="ic" data-icon="user"></span><b>我的局内身份</b></div>
      <div class="avatar-upload" id="st-avatar" style="width:72px;height:72px;margin:14px auto 0;"><span class="ic sm" data-icon="upload"></span></div>
      <label>昵称</label><input id="st-name" maxlength="8" placeholder="我">
    </div>
    <div class="card mt16">
      <b>偏好</b>
      <div class="row mt8"><span class="grow">思考内容展示</span><span class="switch"><input type="checkbox" id="st-thinking"><span class="track"></span></span></div>
      <div class="row mt8"><span class="grow">音效</span><span class="switch"><input type="checkbox" id="st-sound"><span class="track"></span></span></div>
      <label>自动播放默认间隔（毫秒）</label>
      <select id="st-autoplay"><option value="300">0.3s</option><option value="800">0.8s</option><option value="1500" selected>1.5s</option><option value="3000">3s</option></select>

/* 头像压缩 */
function resizeImage(file){
  return new Promise(res=>{
    if(!file){ res(null); return; }
    const rd=new FileReader();
    rd.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement("canvas"); c.width=c.height=128;
        const ctx=c.getContext("2d");
        const s=Math.min(img.width,img.height);
        ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);
        let u=null; try{ u=c.toDataURL("image/webp",0.8); }catch(_){ u=c.toDataURL("image/jpeg",0.8); }
        res(u);
      };
      img.onerror=()=>res(null);
      img.src=e.target.result;
    };

/* ============ 5. 声音（WebAudio 合成） ============ */
const Sound = {
  ctx:null,
  play(kind){
    if(!settings.sound) return;
    try{
      if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      const c=this.ctx, o=c.createOscillator(), g=c.createGain(), t=c.currentTime;
      o.connect(g); g.connect(c.destination);
      const cfg={night:[220,0.5],dawn:[440,0.3],death:[180,0.15],vote:[600,0.5]}[kind]||[440,0.3];
      o.frequency.setValueAtTime(cfg[0],t);
      g.gain.setValueAtTime(0.001,t); g.gain.exponentialRampToValueAtTime(0.08,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+cfg[1]);
      o.start(t); o.stop(t+cfg[1]+0.05);
      if(kind==="death"){ setTimeout(()=>this.play("death2"),120); }
      if(kind==="death2"){ }
    }catch(e){}
  }
};

/* ============ 6. 引擎 ============ */
function buildGame(cfg){
  // cfg: {mode, playerCount, roles[], seatAssign:[{seat,charId,role|null}], userSeat|null, advanced}
  const players=[];
  const charById={}; characters.forEach(c=>charById[c.id]=c);
  // 座位人物占位
  const seats=[];
  for(let i=1;i<=cfg.playerCount;i++) seats.push(i);
  const seatChar={}; cfg.seatAssign.forEach(a=>{ if(a.charId) seatChar[a.seat]=a.charId; });
  const seatRole={}; cfg.seatAssign.forEach(a=>{ if(a.role) seatRole[a.seat]=a.role; });

  // 洗牌角色
  let roles=[...cfg.roles];
  // 用户指定身份优先
  const assignedRoles={};
  const remaining=[];
  roles.forEach((r,i)=>{
    // 找第一个未分配且指定了该角色的席位
    const target = Object.keys(seatRole).map(Number).find(s=>seatRole[s]===r && !(s in assignedRoles));
    if(target!=null){ assignedRoles[target]=r; }
    else remaining.push(r);
  });
  // 排序：先占指定，随机剩余
  let ri=remaining.slice().sort(()=>Math.random()-0.5);
  for(const s of seats){
    let role;
    if(s in assignedRoles) role=assignedRoles[s];
    else role=ri.shift();
    const isHuman = cfg.mode==="play" && s===cfg.userSeat;
    let char = isHuman ? {id:"user",name:settings.user.name,avatar:settings.user.avatar,personality:"",apiMode:"global",apiConfig:settings.globalAPI}
                       : (charById[seatChar[s]] || null);
    if(!char && !isHuman){
      // 临时补位
      char = makeTempCharacter();
    }
    const roleInfo = ROLES[role];
    let faction = roleInfo.faction;
    players.push({
      seat:s, characterId:char.id, name:char.name, avatar:char.avatar||null, role:role,
      faction:faction, alive:true, deathInfo:null, isHuman:isHuman, isTempCharacter:char.isTemp||false,
      apiMode:char.apiMode||"global", apiConfig:char.apiConfig||settings.globalAPI,
      profile:(char.personality||"").slice(0,200), memory:[], couple:false
    });
  }
  players.sort((a,b)=>a.seat-b.seat);

  game = {
    meta:{mode:cfg.mode, settings:JSON.parse(JSON.stringify(settings)), createTime:Date.now()},
    day:1, phase:"night", playerCount:cfg.playerCount, seats, players,
    couple:null, cupidFaction:null, thirdParty:[],
    nightState:{wolfTarget:null,guardTarget:null,witchSaveUsed:false,witchPoisonTarget:null,seerTarget:null},
    flags:{witchPotions:{save:true,poison:true},guardLastTarget:null,idiotRevealed:[],noVoteRights:[],hiddenWolfOut:false},
    votes:{}, history:[], stepIndex:0, stepCounter:0, winner:null,
    apiStats:{calls:0,estTokens:0},
    offlineReasons:{},
    advanced:cfg.advanced||{},
    speechesByStep:{} // 辅助：当日发言记录
  };
}
function makeTempCharacter(){
  const nm = NAME_POOL[Math.floor(Math.random()*NAME_POOL.length)] + Math.floor(Math.random()*90+10);
  const c = {id:uid(),name:nm,avatar:null,personality:PERSONAS[Math.floor(Math.random()*PERSONAS.length)],
    apiMode:"global",apiConfig:settings.globalAPI,isTemp:true,usedCount:0,createdAt:Date.now(),lastUsedAt:0};
  characters.push(c); saveCharacters();
  return c;
}
function getPlayer(seat){ return game.players.find(p=>p.seat===seat); }
function alivePlayers(){ return game.players.filter(p=>p.alive); }
function aliveSeats(){ return alivePlayers().map(p=>p.seat); }
function wolvesAlive(){
  return game.players.filter(p=>p.alive && isWolfFaction(p));
}
function normalWolvesAlive(){ // 有狼刀资格的狼（不含隐狼）
  return game.players.filter(p=>p.alive && isWolfNormal(p));
}

function deathPermissions(cause){
  return {
    lastWords: cause==="exile",
    hunterShoot:(cause==="wolf_kill"||cause==="exile"),
    idiotReveal: cause==="exile",
    bomberBoom: cause==="exile"
  };
}

function markDeath(seat,cause,by){
  const p=getPlayer(seat);
  if(!p||!p.alive) return false;
  p.alive=false; p.deathInfo={day:game.day,cause,by:by||null};
  return true;
}

function checkWin(){
  const alive = alivePlayers();
  const wolves = alive.filter(p=>isWolfFaction(p));
  const thirds = alive.filter(p=>p.faction==="third");
  const goods = alive.filter(p=>p.faction!=="wolf" && p.faction!=="third");
  const civilians = goods.filter(p=>p.role==="villager");
  const gods = goods.filter(p=>p.role!=="villager");
  // ① 第三方获胜
  const nonThird = alive.filter(p=>p.faction!=="third");
  if(thirds.length>=1 && nonThird.length===0){ game.winner="third"; return true; }
  // ② 好人胜利
  if(wolves.length===0){ game.winner="good"; return true; }
  // ③ 狼人屠边
  if(civilians.length===0 || gods.length===0){
    // 两狼情侣且丘比特存活 → 平局
    if(game.cupidFaction==="draw" && getPlayer(game.couple.cupid) && getPlayer(game.couple.cupid).alive){
      game.winner="draw"; return true;
    }
    game.winner="wolf"; return true;
  }
  return false;
}

function hiddenWolfCheck(){
  // 狼阵营存活者仅剩隐狼一人 → 隐狼自动出局
  const wf = game.players.filter(p=>p.alive && isWolfFaction(p));
  if(wf.length===1 && wf[0].role==="hidden_wolf"){
    markDeath(wf[0].seat,"system",null);
    return wf[0];
  }
  return null;
}

/* ---- 脚步发射 ---- */
function visibilitySeats(step){
  const v=step.visibility;
  if(v==="all") return game.seats.filter(s=>getPlayer(s).alive);
  if(v==="wolves") return normalWolvesAlive().map(p=>p.seat);
  if(Array.isArray(v)) return v;
  if(typeof v==="number") return [v];
  return [];
}
function stepVisible(step,view){
  if(view==="god") return true;
  const seat=view;
  const v=step.visibility;
  if(v==="all") return true;
  if(v==="wolves") return normalWolvesAlive().some(p=>p.seat===seat);
  if(Array.isArray(v)) return v.includes(seat);
  if(typeof v==="number") return v===seat || (step.actor===view);
  return false;
}

async function emit(step){
  step.id = ++game.stepCounter;
  step.day = game.day;
  game.history.push(step);
  game.stepIndex = game.history.length;
  // 记忆写入
  const seats = visibilitySeats(step);
  seats.forEach(s=>{
    const p=getPlayer(s); if(!p) return;
    const text = memoryTextFor(step,s);
    if(text) p.memory.push({day:step.day, phase:step.phase, text});
  });
  saveGame();
  renderTable(); renderEventStream(); updateTopBar();
  await pauseForStep(step);
  return step;
}

function memoryTextFor(step,seat){
  const who = step.actor? (getPlayer(step.actor)? getPlayer(step.actor).name : step.actor+"号") : "系统";
  switch(step.type){
    case "private": return `【私信】${step.display.text||"."}`;
    case "wolf_chat": return `【狼队】${who}：${step.payload&&step.payload.speech||step.display.text||""}`;
    case "reveal": return `【身份公开】${step.display.text||""}`;
    case "broadcast": if(step.display.card==="system") return `【系统】${step.display.text||""}`; return `【${step.display.title||"公告"}】${step.display.text||""}`;
    case "skill": return `【技能】${step.display.text||""}`;
    default: return step.display && step.display.text ? step.display.text : "";
  }
}

function pauseForStep(step){
  return new Promise(resolve=>{
    if(game.winner!=null){ resolve(); return; }
    const mode=game.meta.mode;
    if(mode==="spectate"){
      if(autoplay) setTimeout(resolve, settings.autoPlayInterval||1500);
      else { pendingStepResolve=resolve; renderActionBar("next"); }
    } else {
      if(paused){ pendingStepResolve=resolve; renderActionBar("resume"); return; }
      setTimeout(resolve, playAutoDelay);
    }
  });
}

/* ============ 7. AI 客户端 ============ */
let apiWarned = false;
function getApiConfig(player){
  if(player.apiMode==="custom" && player.apiConfig && player.apiConfig.apiKey){
    // 补齐缺失字段，避免自定义配置里 model/baseUrl 为空导致请求失败
    const g = settings.globalAPI || {};
    const c = player.apiConfig;
    return {
      baseUrl: c.baseUrl || g.baseUrl || "https://api.deepseek.com",
      apiKey: c.apiKey,
      model: c.model || g.model || "deepseek-chat",
      temperature: (c.temperature!=null ? c.temperature : (g.temperature!=null?g.temperature:0.9)),
      maxTokens: c.maxTokens || g.maxTokens || 600,
      timeoutMs: c.timeoutMs || g.timeoutMs || 60000
    };
  }
  return settings.globalAPI;
}
function httpErr(resp){
  const d=resp && resp.data;
  if(!d){
    return resp && resp.status===0
      ? "网络/CORS 错误（浏览器无法直连该接口，需支持 CORS 或换用支持浏览器直连的接口）"
      : ("请求失败(" + (resp?resp.status:"?") + ")");
  }
  const e=d.error;
  if(e) return (e.message||e.code||JSON.stringify(e));
  if(d.message) return d.message;
  return "请求失败(" + (resp.status||"?") + ")";
}
function markOffline(player, err){
  if(game){
    game.apiStats.fails=(game.apiStats.fails||0)+1;
    game.offlineReasons = game.offlineReasons || {};
    if(player && player.seat!=null) game.offlineReasons[player.seat]=err||"未知错误";
  }
  if(!apiWarned){
    apiWarned=true;
    toast("AI 调用失败："+(err||"未知错误")+"，已切换法官代打。请在「设置」检查 API。");
  }
}
async function aiAct(player, actionType, ctx){
  const cfg=getApiConfig(player);
  const instruction=promptInstruction(player, actionType, ctx);
  if(!cfg.apiKey){
    const err="未配置 API Key";
    markOffline(player, err);
    return {json:fallback(player,actionType,ctx), thinking:null, offline:true, err};
  }
  const messages=[
    {role:"system",content:RULES_SYSTEM()},
    {role:"system",content:roleCard(player) + (player.profile?personaBlock(player):"")},
    {role:"system",content:memoryBlock(player)},
    {role:"user",content:instruction}
  ];
  const body={model:cfg.model,messages,temperature:cfg.temperature!=null?cfg.temperature:0.9,max_tokens:cfg.maxTokens||600,stream:false};
  let lastText="", lastErr="";
  for(let attempt=0; attempt<2; attempt++){
    try{
      const resp = await fetchJSON(cfg, body);
      if(resp.ok){
        game.apiStats.calls++;
        const data=resp.data;
        if(!data || !data.choices || !data.choices[0] || !data.choices[0].message){
          lastErr = (data && data.error) ? ("接口返回错误："+(data.error.message||data.error)) : "接口返回格式异常（无 choices）";
          continue;
        }
        const msg = data.choices[0].message;
        const thinking = extractThinking(data);
        const content = msg.content || "";
        lastText=content;
        const parsed = parseJSON(content);
        if(parsed){ game.apiStats.estTokens += estimateTokens(messages,content); return {json:parsed, thinking, model:data.model||cfg.model}; }
        // 非 JSON，重试纠正
        const fix = await fetchJSON(cfg, Object.assign({},body,{messages:messages.concat([
          {role:"assistant",content:content}, {role:"user",content:"你上一条回复不是有效 JSON，请只输出一个 JSON 对象，不要任何其他文字。"}
        ])}));
        if(fix.ok){
          game.apiStats.calls++;
          const d2=fix.data;
          const c2=d2.choices&&d2.choices[0]&&d2.choices[0].message;
          const p2=parseJSON(c2?c2.content:"");
          if(p2){ game.apiStats.estTokens+=estimateTokens(messages,c2.content); return {json:p2, thinking:extractThinking(d2), model:d2.model||cfg.model}; }
          lastText=c2?c2.content:"";
          lastErr="模型未返回有效 JSON";
        } else {
          lastErr = httpErr(fix);
        }
      } else {
        lastErr = httpErr(resp);
        if(resp.status===401||resp.status===403){
          const err="认证失败("+resp.status+")，API Key 无效或已过期";
          markOffline(player, err);
          return {json:fallback(player,actionType,ctx), thinking:null, offline:true, err, keyErr:true};
        }
        if(resp.status===429){ await sleep(3000*(attempt+1)); continue; }
      }
    }catch(e){ lastText="异常："; lastErr="CORS/网络错误（浏览器无法直连该接口）"; }
  }
  if(!lastErr) lastErr = "未知错误";
  markOffline(player, lastErr);
  return {json:fallback(player,actionType,ctx), thinking:null, offline:true, err:lastErr, raw:lastText};
}
function fetchJSON(cfg, body){
  const base=(cfg.baseUrl||"https://api.deepseek.com").replace(/\/+$/,"");
  const url=base+"/chat/completions";
  const timeout=cfg.timeoutMs||60000;
  const ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
  const timer = ctrl ? setTimeout(()=>ctrl.abort(), timeout) : null;
  const opt={
    method:"POST",
    headers:{"Authorization":"Bearer "+cfg.apiKey,"Content-Type":"application/json"},
    body:JSON.stringify(body)
  };
  if(ctrl) opt.signal=ctrl.signal;
  return fetch(url,opt).then(async r=>{
    if(timer) clearTimeout(timer);
    let data=null; try{ data=await r.json(); }catch(e){}
    return {ok:r.ok,status:r.status,data};
  }).catch(e=>{
    if(timer) clearTimeout(timer);
    return {ok:false,status:0,data:null,error:e};
  });
}
function extractThinking(data){
  try{
    const m=data.choices&&data.choices[0]&&data.choices[0].message;
    if(!m) return null;
    const fields=["reasoning_content","reasoning","thinking","chain_of_thought"];
    for(const f of fields){ if(m[f]!=null) return m[f]; }
    return null;
  }catch(e){ return null; }
}
function parseJSON(str){
  if(!str) return null;
  try{ return JSON.parse(str); }catch(e){}
  let s=str;
  s=s.replace(/^```(json)?/gm,"").replace(/```$/gm,"").trim();
  const a=s.indexOf("{"); const b=s.lastIndexOf("}");
  if(a>=0 && b>a){ try{ return JSON.parse(s.slice(a,b+1)); }catch(e){} }
  return null;
}
function estimateTokens(messages,out){
  let t=0; messages.forEach(m=>t+=Math.ceil((m.content||"").length/3)); t+=Math.ceil((out||"").length/3); return t;
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* 兜底 */
function fallback(player, actionType, ctx){
  const alive=ctx.candidates || aliveSeats().filter(s=>s!==player.seat);
  const rnd=n=>n[Math.floor(Math.random()*n.length)];
  switch(actionType){
    case "couple": return {couple: pickN(alive.filter(s=>true),2)};
    case "wolf_talk": return {speech:"建议稳妥出刀。"};
    case "wolf_kill": return {target: pickTarget(ctx)};
    case "guard": return {protect: pickTarget(ctx)};
    case "seer": return {check: pickTarget(ctx)};
    case "witch_save": return {save:false};
    case "witch_poison": return {poison:null};
    case "speech": return {type:"speech",speech:"过。"};
    case "boom": return {type:"boom",target:null,last_words:"过。"};
    case "last_words": return {last_words:"过。"};
    case "vote": return {vote: pickVote(ctx),reason:""};
    case "hunter_shoot": return {shoot:null};
    default: return {};
  }
}
function pickTarget(ctx){
  const list=ctx.candidates && ctx.candidates.length? ctx.candidates : aliveSeats();
  const legal=list.filter(s=>s!=null);
  return legal.length? legal[Math.floor(Math.random()*legal.length)] : null;
}
function pickVote(ctx){
  const list=(ctx.candidates && ctx.candidates.length? ctx.candidates : aliveSeats()).filter(s=>s!==ctx.self);
  return list.length? list[Math.floor(Math.random()*list.length)] : null;
}
function pickN(arr,n){
  const a=arr.slice().sort(()=>Math.random()-0.5); return a.slice(0,n);
}

function personaBlock(p){

function promptInstruction(p, actionType, ctx){

  // 夜晚氛围
  $("night-dim").classList.toggle("hidden", game.phase!=="night");
}
function renderTable(){
  if(!game) return;
  const wrap=$("table-seats");
  const n=game.playerCount;
  let html="";
  game.players.forEach((p,i)=>{
    const pos = seatPos(i,n);
    const av = p.avatar? `<img src="${p.avatar}">` : icon("user");
    const dead = !p.alive;
    const isActive = game.currentActor===p.seat;
    const isSpeaking = game.currentSpeaker===p.seat;
    html += `<div class="seat ${dead?'dead':''} ${p.isHuman?'user':''} ${isActive?'active':''} ${isSpeaking?'speaking':''}"
      style="left:${pos.x}%;top:${pos.y}%;" data-seat="${p.seat}">
      <div class="avwrap"><div class="av">${av}</div><span class="num">${p.seat}</span>${dead?'<span class="sk">'+icon("skull","sm")+'</span>':''}</div>
      <div class="nm">${esc(p.name)}</div>
    </div>`;
  });
  wrap.innerHTML=html;
  wrap.querySelectorAll(".seat").forEach(el=>el.onclick=()=>openSeatDetail(parseInt(el.dataset.seat)));
  // 桌心
  renderCenter();
  // 视角下拉
  renderViewSelect();
}
function seatPos(i,n){
  const ang = -Math.PI/2 + (i*2*Math.PI/n);
  const r = 40; // 百分比半径
  return {x:50 + r*Math.cos(ang), y:50 + r*Math.sin(ang)};
}
function renderCenter(){
  const c=$("table-center");
  if(!game) return;
  if(game.phase==="night"){
    // 夜晚进度
    const seq=[];
    if(game.day===1 && roleAlive("cupid")) seq.push("丘比特");
    if(normalWolvesAlive().length) seq.push("狼人");
    if(roleAlive("guard")) seq.push("守卫");
    if(roleAlive("seer")) seq.push("预言家");
    if(roleAlive("witch")) seq.push("女巫");
    const done = game.nightProgress||[];
    $("center-t").innerHTML = seq.map(s=>`<span style="margin:0 2px;${done.includes(s)?'color:var(--gold)':'color:var(--sub)'}">${s}</span>`).join("");
    $("center-v").textContent = game.centerMain || "夜晚行动中";
  } else if(game.phase==="speech"){
    $("center-t").textContent = game.centerSub || "发言中";
    $("center-v").textContent = game.centerMain || "";
  } else if(game.phase==="vote"){
    $("center-t").textContent = "投票进行中";
    $("center-v").textContent = game.centerMain || "";
  } else if(game.phase==="settle"){
    $("center-t").textContent = "";
    $("center-v").textContent = game.centerMain || "";
  } else {
    $("center-t").textContent=""; $("center-v").textContent=game.centerMain||"";
  }
}
function roleAlive(key){ return game.players.some(p=>p.alive && p.role===key); }
function renderViewSelect(){
  const sel=$("game-view");
  const cur=sel.value;
  let opts='<option value="god">上帝视角</option>';

function renderEventStream(){
  const box=$("event-scroll");
  if(!game) return;
  currentView = $("game-view").value;
  let html="";
  for(const step of game.history){
    if(!stepVisible(step,currentView)) continue;
    html += stepCardHTML(step);
  }
  box.innerHTML=html;
  box.scrollTop = box.scrollHeight;
  bindThinking();
  bindExpand();
}
function stepCardHTML(step){
  const d=step.display||{};
  const ic=d.icon||"clock";
  let cls = {broadcast:"",private:"private",wolf_chat:"wolf",judge:"",reveal:"result",skill:"",user_wait:""}[step.type]||"";
  if(step.type==="judge" && d.card==="system") cls = "system";
  if(d.card==="system") cls="system";
  const thinking = step.thinking && settings.showThinking ? thinkingHTML(step.thinking) : "";
  let head="";
  if(step.type!=="judge" && step.type!=="broadcast" && step.actor!=null && d.card!=="system"){
    const p=getPlayer(step.actor);
    const who = p? `${p.seat}号·${p.name}` : (step.actor+"号");
    head=`<div class="step-head">${icon(step.type==="wolf_chat"?"wolf":(step.type==="private"?"lock":ic),"sm")}<span class="who">${who}</span><span>${d.title||""}</span></div>`;
  } else if(step.type==="wolf_chat"){
    head=`<div class="step-head">${icon("wolf","sm")}<span class="who">狼队</span></div>`;
  }
  let body = d.text || "";
  if(step.type==="wolf_chat" && step.payload && step.payload.speech){ body = step.payload.speech; }
  const offline = step.payload && step.payload.offline;
  const reason = offline ? esc((game && game.offlineReasons && game.offlineReasons[step.actor]) || (step.payload && step.payload.err) || "") : "";
  const errNote = offline ? `<div class="muted" style="font-size:11px;color:#c7744f;">（${step.actor?getPlayer(step.actor).name+"号":""} AI 掉线，法官代打${reason?"："+reason:""}）</div>` : "";
  const bodyHtml = `<div class="step-body ${body.length>80?'clamp':''}">${esc(body)}</div>${body.length>80?'<div class="step-expand">展开</div>':''}${errNote}`;
  return `<div class="step-card ${cls}">${head}${thinking}${bodyHtml}</div>`;
}
function thinkingHTML(t){
  return `<div class="thinking"><div class="tt">${icon("chevron","sm")} 思考过程</div><div class="txt">${esc(t)}</div></div>`;
}
function bindThinking(){
  document.querySelectorAll(".thinking .tt").forEach(t=>{ t.onclick=()=>{ t.parentElement.classList.toggle("open");
    t.querySelector(".ic").innerHTML = icon(t.parentElement.classList.contains("open")?"chevron":"chevron","sm");
    t.parentElement.classList.contains("open") && (t.querySelector(".ic").innerHTML=icon("chevron","sm"));
  }; });
}
function bindExpand(){
  document.querySelectorAll(".step-expand").forEach(b=>{ b.onclick=()=>{ const body=b.previousElementSibling; body.classList.toggle("clamp"); b.textContent = body.classList.contains("clamp")?"展开":"收起"; }; });

      bind=()=>{
        let sel=null;
        document.querySelectorAll("#action-bar .tg").forEach(b=>{ b.onclick=()=>{ document.querySelectorAll("#action-bar .tg").forEach(x=>x.classList.remove("on")); b.classList.add("on"); sel=parseInt(b.dataset.s); }; });
        $("ua-confirm").onclick=()=>resolve(actionType==="boom"?{type:"boom",target:sel,last_words:"我自爆。"}:{shoot:sel});
        if(actionType==="hunter_shoot") $("ua-skip").onclick=()=>resolve({shoot:null});

      const candidates = ctx && ctx.candidates || aliveSeats();
      let title="选择目标";
      if(actionType==="seer") title="选择查验对象";

      else if(actionType==="couple") title="选择两名玩家成为情侣";

      bind=()=>{

          else if(actionType==="wolf_kill") resolve({target:sel[0]});
          else if(actionType==="witch_poison") resolve({poison:sel[0]});
        };
      };
    }
    renderActionBar("user", html);

  });

}

/* ============ 14. 游戏流程编排 ============ */
async function startGame(cfg){
  apiWarned = false;
  buildGame(cfg);
  currentView = cfg.mode==="play" ? cfg.userSeat : "god";
  // 私信身份
  for(const p of game.players){
    const r=ROLES[p.role];
    const win = p.winCondition || r.win;
    game.history.push({id:++game.stepCounter,day:1,phase:"night",type:"private",actor:p.seat,
      visibility:[p.seat], display:{icon:r.icon, title:"身份", text:`你是 ${r.name}（${FACTION_LABEL[p.faction]}），胜利条件：${win}`}, thinking:null, payload:{}});
    p.memory.push({day:1,phase:"night",text:`你是代号 ${r.name}，阵营 ${FACTION_LABEL[p.faction]}，胜利条件 ${win}`});
  }
  game.stepIndex = game.history.length;
  showScreen("screen-game");
  renderTable(); renderEventStream(); updateTopBar();
  await runGameLoop();
}

async function runGameLoop(){
  try{
    while(game.winner==null){
      const maxDays = parseInt(game.advanced.forceDrawDays||30);
      if(game.day>maxDays){ game.winner="draw"; break; }
      game.phase="night";
      await nightPhase();
      if(game.winner!=null) break;
      game.phase="speech";
      await dayPhase();
      if(game.winner!=null) break;
      game.day++;
    }
    await finishGame();
  }catch(e){
    console.error(e);
    toast("发生异常："+e.message);
  }
}

/* ---- 夜晚 ---- */
async function nightPhase(){
  const day=game.day;
  game.nightState={wolfTarget:null,guardTarget:null,witchSaveUsed:false,witchPoisonTarget:null,seerTarget:null};
  await emit({phase:"night",type:"broadcast",actor:null,visibility:"all",display:{icon:"moon",title:"天黑",text:"天黑了，所有人闭眼。",card:"system"},thinking:null,payload:{}});
  Sound.play("night");
  if(day===1 && roleAlive("cupid")){
    await cupidPhase();
    if(game.winner!=null) return;
  }
  // 狼人阶段
  await wolfPhase();
  if(game.winner!=null) return;
  // 守卫
  const guard=game.players.find(p=>p.alive&&p.role==="guard");
  if(guard){
    const last=game.flags.guardLastTarget;
    const canSelf = game.advanced.guardSelf || false;
    let cand = aliveSeats();
    if(last!=null && cand.length>1) cand = cand.filter(s=>s!==last);
    if(!canSelf) cand = cand.filter(s=>s!==guard.seat);
    const res = await act(guard,"guard",{candidates:cand,lastTarget:last,canSelf});
    let target = validTarget(res.json.protect, cand.contains?cand:[], cand);
    target = sanitizeTarget(target, cand, guard);
    game.nightState.guardTarget=target; game.flags.guardLastTarget=target;
    await emit({phase:"night",type:"private",actor:guard.seat,visibility:[guard.seat],display:{icon:"shield",title:"守卫",text:`你守护了 ${target!=null?target+"号":"无人"}。`},thinking:res.thinking,payload:{protect:target,offline:res.offline}});
  }
  // 预言家
  const seer=game.players.find(p=>p.alive&&p.role==="seer");
  if(seer){
    let cand = aliveSeats().filter(s=>s!==seer.seat);
    const res = await act(seer,"seer",{candidates:cand});
    let target = sanitizeTarget(res.json.check,cand,seer);
    if(target==null) target = cand[Math.floor(Math.random()*cand.length)];
    game.nightState.seerTarget=target;
    const tp=getPlayer(target);
    const isWolf = isWolfFaction(tp) && tp.role!=="hidden_wolf";
    const resultTxt = isWolf? "狼人" : "好人";
    tp.memory.push({day,phase:"night",text:`你被查验为${resultTxt}（只有预言家知道）`});
    await emit({phase:"night",type:"private",actor:seer.seat,visibility:[seer.seat],display:{icon:"eye",title:"查验",text:`查验结果：${target}号是${resultTxt}。`},thinking:res.thinking,payload:{check:target,result:resultTxt,offline:res.offline}});
  }
  // 女巫
  const witch=game.players.find(p=>p.alive&&p.role==="witch");
  if(witch){
    const t=game.nightState.wolfTarget;
    if(game.flags.witchPotions.save && t!=null){
      const res = await act(witch,"witch_save",{target:t});
      if(res.json.save){ game.nightState.witchSaveUsed=true; game.flags.witchPotions.save=false;
        await emit({phase:"night",type:"private",actor:witch.seat,visibility:[witch.seat],display:{icon:"flask",title:"女巫",text:`你使用了解药救 ${t} 号。`},thinking:res.thinking,payload:{save:true,offline:res.offline}});
      } else {
        await emit({phase:"night",type:"private",actor:witch.seat,visibility:[witch.seat],display:{icon:"flask",title:"女巫",text:"你选择不使用解药。"},thinking:res.thinking,payload:{save:false,offline:res.offline}});
      }
    }
    if(game.flags.witchPotions.poison){
      const res = await act(witch,"witch_poison",{candidates:aliveSeats()});
      let pt = res.json.poison!=null? sanitizeTarget(res.json.poison, aliveSeats(), witch) : null;
      if(pt!=null){ game.nightState.witchPoisonTarget=pt; game.flags.witchPotions.poison=false;
        await emit({phase:"night",type:"private",actor:witch.seat,visibility:[witch.seat],display:{icon:"flask",title:"女巫",text:`你对 ${pt} 号使用了毒药。`},thinking:res.thinking,payload:{poison:pt,offline:res.offline}});
      }
    }
  }
  await settleNight();
}

function sanitizeTarget(t, candidates, self){
  const c = candidates || [];
  if(t!=null && c.includes(t)) return t;
  if(t!=null && c.length && !c.includes(t)){
    // 非法（如死者/自己），退回：随机合法
    if(c.length) return c[Math.floor(Math.random()*c.length)];
  }
  return null;
}
function validTarget(t){ return t; }

async function cupidPhase(){
  const cupid=game.players.find(p=>p.alive&&p.role==="cupid");
  if(!cupid) return;
  let cand=aliveSeats();
  const res = await act(cupid,"couple",{candidates:cand});
  let cp=res.json.couple;
  if(!Array.isArray(cp)||cp.length<2){ cp=cand.slice().sort(()=>Math.random()-0.5).slice(0,2); }
  cp=[sanitizeTarget(cp[0],cand,cupid),sanitizeTarget(cp[1],cand,cupid)];
  if(cp[0]===cp[1]||cp[0]==null||cp[1]==null){ const alt=cand.filter(s=>s!==cupid.seat); if(alt.length>=2) cp=[alt[0],alt[1]]; else cp=[cand[0],cand[1]]; }
  game.couple={a:cp[0],b:cp[1],cupid:cupid.seat};
  const a=getPlayer(cp[0]), b=getPlayer(cp[1]);
  // 判定丘比特阵营
  const af=a.faction, bf=b.faction;
  let cf, winText;
  const aIsWolf=isWolfFaction(a), bIsWolf=isWolfFaction(b);
  if(!aIsWolf && !bIsWolf){ cf="good"; winText="好人阵营获胜（所有狼人出局）。"; }
  else if(aIsWolf && bIsWolf){ cf="good"; game.cupidFaction="draw"; winText="狼人阵营获胜；若你存活，则算平局。"; }
  else { cf="third"; winText="第三方阵营获胜（驱逐所有非第三方玩家）。"; }
  game.cupidFaction = game.cupidFaction||cf;
  cupid.faction = (aIsWolf&&bIsWolf)? "good":cf;
  cupid.cupidWinText = winText;
  await emit({phase:"night",type:"private",actor:cupid.seat,visibility:[cupid.seat],display:{icon:"bow",title:"丘比特",text:`你连接了 ${cp[0]} 号与 ${cp[1]} 号成为情侣。${winText}`},thinking:res.thinking,payload:{couple:cp,offline:res.offline}});
  // 通知情侣
  for(const s of cp){
    const p=getPlayer(s); p.couple=true;
    if(cf==="third"){ p.faction="third"; p.winCondition="第三方阵营获胜（驱逐所有非第三方玩家）。"; if(!game.thirdParty.includes(s)) game.thirdParty.push(s); }
    await emit({phase:"night",type:"private",actor:s,visibility:[s],display:{icon:"heart",title:"情侣",text:"你是丘比特选中的情侣之一。"},thinking:null,payload:{}});
  }
  if(cf==="third" && !game.thirdParty.includes(cupid.seat)) game.thirdParty.push(cupid.seat);
}

async function wolfPhase(){
  const wolves=normalWolvesAlive().sort((a,b)=>a.seat-b.seat);
  if(wolves.length===0) return;
  if(wolves.length===1){
    const w=wolves[0];
    const res=await act(w,"wolf_kill",{candidates:aliveSeats().filter(s=>!isWolfFaction(getPlayer(s))), wolves:wolves.map(x=>x.seat)});
    let t=sanitizeTarget(res.json.target, aliveSeats().filter(s=>!isWolfFaction(getPlayer(s))), w);
    game.nightState.wolfTarget=t;
    await emit({phase:"night",type:"wolf_chat",actor:w.seat,visibility:"wolves",display:{icon:"wolf",title:"狼刀",text:`狼队决定击杀 ${t!=null?t+"号":""}。`},thinking:res.thinking,payload:{target:t,offline:res.offline}});
    return;
  }
  // 讨论
  let prev="";
  const speeches=[];
  for(const w of wolves){
    const res=await act(w,"wolf_talk",{candidates:aliveSeats(),wolves:wolves.map(x=>x.seat),prev});
    const sp=res.json.speech||"过。";
    speeches.push({seat:w.seat,name:w.name,speech:sp});
    prev += `${w.seat}号：${sp}\n`;
    await emit({phase:"night",type:"wolf_chat",actor:w.seat,visibility:"wolves",display:{icon:"wolf",title:"狼人",text:""},thinking:res.thinking,payload:{speech:sp,offline:res.offline}});
  }
  // 确认刀口：各狼投票多数决
  const candW = aliveSeats().filter(s=>!isWolfFaction(getPlayer(s)));
  const votes={};
  for(const w of wolves){
    const res=await act(w,"wolf_kill",{candidates:candW, wolves:wolves.map(x=>x.seat)});
    let t=sanitizeTarget(res.json.target,candW,w)||(candW[Math.floor(Math.random()*candW.length)]);
    votes[w.seat]=t;
  }
  const tally={}; wolves.forEach(w=>{ const t=votes[w.seat]; tally[t]=(tally[t]||0)+1; });
  let best=null,bestN=-1;
  for(const t in tally){ if(tally[t]>bestN || (tally[t]===bestN && (best==null||parseInt(t)<parseInt(best)))){ bestN=tally[t]; best=parseInt(t); } }
  game.nightState.wolfTarget=best;
  await emit({phase:"night",type:"wolf_chat",actor:null,visibility:"wolves",display:{icon:"wolf",title:"狼刀",text:`狼队决定击杀 ${best!=null?best+"号":""}。`},thinking:null,payload:{target:best,votes}});
}

async function settleNight(){
  const ns=game.nightState;
  let deaths=[];
  const T=ns.wolfTarget;
  if(T!=null){
    const G=ns.guardTarget, S=ns.witchSaveUsed;
    const same = (G===T);
    const xorRule = game.advanced.sameGuardSave==="dead";
    let saved;
    if(xorRule){ saved = (same && !S) || (!same && S); /* 同守同救=死：saved=(G==T) XOR S */ }
    else { saved = same || S; }
    if(saved){ /* 狼刀未致死 */ }
    else {
      if(markDeath(T,"wolf_kill",null)) deaths.push({seat:T,cause:"wolf_kill"});
    }
  }
  if(ns.witchPoisonTarget!=null){
    if(markDeath(ns.witchPoisonTarget,"poison",null)) deaths.push({seat:ns.witchPoisonTarget,cause:"poison"});
  }
  // 殉情链
  deaths = expandCoupleSuicide(deaths);
  game.phase="settle";
  // 天亮公告
  if(deaths.length===0){
    game.centerMain="平安夜";
    await emit({phase:"settle",type:"judge",actor:null,visibility:"all",display:{icon:"sun",title:"天亮",text:"天亮了。昨晚是平安夜。",card:"system"},thinking:null,payload:{deaths:[]}});
  } else {
    const names=deaths.map(d=>d.seat+"号").join("、");
    game.centerMain = deaths.map(d=>d.seat+"号 死亡").join(" · ");
    await emit({phase:"settle",type:"judge",actor:null,visibility:"all",display:{icon:"sun",title:"天亮",text:`天亮了。昨晚 ${names} 死亡。`,card:"system"},thinking:null,payload:{deaths}});
  }
  Sound.play("dawn");
  // 翻牌 + 处理猎人开枪等
  for(const d of deaths){
    const p=getPlayer(d.seat);
    await revealPlayer(d.seat);
    // 猎人被狼刀：白天宣布时可开枪
    if(p.role==="hunter" && d.cause==="wolf_kill"){
      await hunterShoot(d.seat, "wolf_kill");
    }
    if(game.winner!=null) return;
  }
  // 隐狼自动出局
  const hw=hiddenWolfCheck();
  if(hw){ await emit({phase:"settle",type:"reveal",actor:hw.seat,visibility:"all",display:{icon:"mask",title:"隐狼",text:`${hw.seat}号（隐狼）狼队仅剩其一，自动出局。`},thinking:null,payload:{}});
    await revealPlayer(hw.seat); }
  checkWin();
  game.phase="night"; // 由日间函数推进
}

function expandCoupleSuicide(deaths){
  const out=[...deaths];
  const deadSeats=new Set(out.map(d=>d.seat));
  let changed=true;
  while(changed){
    changed=false;
    for(const d of [...out]){
      const p=getPlayer(d.seat);
      if(p && p.couple && game.couple){
        const partner = game.couple.a===d.seat? game.couple.b : (game.couple.b===d.seat? game.couple.a : null);
        if(partner!=null && !deadSeats.has(partner) && getPlayer(partner).alive){
          markDeath(partner,"couple_suicide",d.seat);
          out.push({seat:partner,cause:"couple_suicide"});
          deadSeats.add(partner); changed=true;
        }
      }
    }
  }
  return out;
}

async function revealPlayer(seat){
  const p=getPlayer(seat); if(!p) return;
  p.revealed=true;
  await emit({phase:game.phase,type:"reveal",actor:null,visibility:"all",display:{icon:"card",title:"翻牌",text:`${p.seat}号的身份是：${ROLES[p.role].name}。`},thinking:null,payload:{seat,role:p.role}});
}

async function hunterShoot(seat, cause){
  const p=getPlayer(seat); if(!p) return; // 猎人已死亡，检查是否可开枪
  const res=await act(p,"hunter_shoot",{candidates:aliveSeats(),cause,canShoot:true});
  const target = sanitizeTarget(res.json.shoot, aliveSeats(), p);
  if(target!=null){
    await emit({phase:game.phase,type:"skill",actor:seat,visibility:"all",display:{icon:"gun",title:"猎人",text:`${seat}号（猎人）开枪带走了 ${target} 号。`},thinking:res.thinking,payload:{target,offline:res.offline}});
    markDeath(target,"hunter_bullet",seat);
    const tp=getPlayer(target); tp&&(tp.revealed=true);
    await revealPlayer(target);
    const hw=hiddenWolfCheck();
    if(hw){ await emit({phase:game.phase,type:"reveal",actor:hw.seat,visibility:"all",display:{icon:"mask",title:"隐狼",text:`${hw.seat}号（隐狼）自动出局。`},thinking:null,payload:{}}); await revealPlayer(hw.seat); }
  }
  checkWin();
}

/* ---- 白天 ---- */
async function dayPhase(){
  game.phase="speech";
  // 若无昨晚死亡且为首日：平安夜
  const alive=aliveSeats().sort((a,b)=>a-b);
  // 发言顺序
  let order=alive.slice();
  // 若昨夜有死者，从死者左手边（座位升序）环绕
  const nightDeaths = game.history.filter(s=>s.phase==="settle" && s.payload&&s.payload.deaths).slice(-1);
  const deaths = nightDeaths[0] && nightDeaths[0].payload.deaths || [];
  let startSeat=order[0];
  if(deaths.length && game.day===1){
    // 有死者的白天从死者左手边开始：死者座位+1
    const minDead=Math.min(...deaths.map(d=>d.seat));
    startSeat = order.find(s=>s>minDead) || order[0];
  } else if(game.day===1 && (game.advanced.firstSpeakerRandom)){
    startSeat = order[Math.floor(Math.random()*order.length)];
  } else if(game.day===1){
    startSeat = (game.advanced.firstSpeaker || 1);
    if(!order.includes(startSeat)) startSeat=order[0];
  }
  // 重排：从 startSeat 开始升序环绕
  let nextSpeechOrder=[];
  let idx=alive.indexOf(startSeat);
  if(idx<0) idx=0;
  for(let i=0;i<alive.length;i++){ nextSpeechOrder.push(alive[(idx+i)%alive.length]); }

  const speeches=[];
  let i=0;
  while(i<nextSpeechOrder.length){
    const seat=nextSpeechOrder[i];
    const p=getPlayer(seat);
    if(!p||!p.alive){ i++; continue; }
    game.currentSpeaker=seat; game.phase="speech";
    game.centerSub=`发言中：${p.name}`; game.centerMain=`${i+1}/${nextSpeechOrder.length}`;
    renderTable();
    // 白狼王可自爆
    let res;
    if(p.role==="white_wolf_king"){
      res=await act(p,"speech",{candidates:aliveSeats(),speeches:speeches.map(s=>`${s.seat}号：${s.speech}`).join("；")||"（无）"});
    } else {
      res=await act(p,"speech",{candidates:aliveSeats(),speeches:speeches.map(s=>`${s.seat}号：${s.speech}`).join("；")||"（无）"});
    }
    if(res.json && res.json.type==="boom"){
      // 自爆
      if(res.json._needTarget){
        // 人类需要选目标（已在 requestUserAction 处理，此处 _needTarget 表示需再次请求带人目标）
        const r2=await act(p,"boom",{candidates:aliveSeats()});
        res=r2;
      }
      const tgt = sanitizeTarget(res.json.target, aliveSeats(), p);
      game.currentActor=p.seat;
      await emit({phase:"speech",type:"skill",actor:p.seat,visibility:"all",display:{icon:"boom",title:"自爆",text:`${p.seat}号（白狼王）自爆${tgt!=null?`，带走了 ${tgt} 号`:""}！`},thinking:res.thinking,payload:{target:tgt,offline:res.offline}});
      p.revealed=true;
      await revealPlayer(p.seat);
      markDeath(p.seat,"self_destruct",null);
      if(tgt!=null){ markDeath(tgt,"taken",p.seat); getPlayer(tgt).revealed=true; await revealPlayer(tgt); }
      // 隐狼检查 + 胜负
      const hw=hiddenWolfCheck(); if(hw){ await emit({phase:"speech",type:"reveal",actor:hw.seat,visibility:"all",display:{icon:"mask",title:"隐狼",text:`${hw.seat}号（隐狼）自动出局。`},thinking:null,payload:{}}); await revealPlayer(hw.seat); }
      if(checkWin()){ return; }
      nextSpeechOrder=nextSpeechOrder.filter(s=>getPlayer(s).alive);
      i++; // 继续
      continue;
    }
    const speech=res.json.speech||"过。";
    speeches.push({seat, name:p.name, speech});
    await emit({phase:"speech",type:"broadcast",actor:p.seat,visibility:"all",display:{icon:"speech",title:"发言",text:speech},thinking:res.thinking,payload:{speech,offline:res.offline}});
    i++;
  }
  game.currentSpeaker=null; game.currentActor=null;
  // 投票阶段
  game.phase="vote";
  const hasVote = aliveSeats().filter(s=>!game.flags.noVoteRights.includes(s));
  game.centerMain=`${hasVote.length}/${hasVote.length}`;
  renderTable();
  await votePhase(hasVote);
}

async function votePhase(voters){
  const candidates = aliveSeats();
  const votes={};
  for(const seat of voters){
    const p=getPlayer(seat);
    const cand = candidates.filter(s=>s!==seat);
    const res=await act(p,"vote",{candidates:cand,self:seat,candidatesAll:candidates});
    let v=res.json.vote;
    v=sanitizeTarget(v,cand,p);
    if(v==null) v=cand[Math.floor(Math.random()*cand.length)];
    votes[seat]=v;
    await emit({phase:"vote",type:"private",actor:seat,visibility:[seat],display:{icon:"vote",title:"投票",text:`你投给了 ${v} 号。`},thinking:res.thinking,payload:{vote:v,offline:res.offline}});
    game.centerMain=`${Object.keys(votes).length}/${voters.length}`;
    renderTable();
  }
  game.votes=votes;
  // 统计
  const tally={};
  Object.values(votes).forEach(v=>{ tally[v]=(tally[v]||0)+1; });
  let top=[]; let max=0;
  for(const t in tally){ if(tally[t]>max){ max=tally[t]; top=[parseInt(t)]; } else if(tally[t]===max){ top.push(parseInt(t)); } }
  game.voteTally=tally;
  // 广播票型
  await emit({phase:"vote",type:"broadcast",actor:null,visibility:"all",display:{icon:"vote",title:"投票结果",text:voteSummary(votes,tally)},thinking:null,payload:{votes,tally}});
  showVoteBoard(votes,tally,top);
  if(top.length>1){
    // 平票 PK
    await emit({phase:"vote",type:"broadcast",actor:null,visibility:"all",display:{icon:"alert",title:"平票",text:`${top.map(t=>t+"号").join("、")} 平票，进入 PK。`,card:"system"},thinking:null,payload:{}});
    // PK 发言
    for(const t of top){
      const p=getPlayer(t);
      const res=await act(p,"speech",{candidates:top,speeches:""});
      const sp=res.json.speech||"过。";
      await emit({phase:"vote",type:"broadcast",actor:t,visibility:"all",display:{icon:"speech",title:"PK发言",text:sp},thinking:res.thinking,payload:{speech:sp,offline:res.offline}});
    }
    // PK 投票（PK者不投）
    const pkVoters=voters.filter(s=>!top.includes(s));
    const votes2={};
    for(const seat of pkVoters){
      const p=getPlayer(seat);
      const res=await act(p,"vote",{candidates:top,self:seat});
      let v=sanitizeTarget(res.json.vote,top,p);
      if(v==null) v=top[Math.floor(Math.random()*top.length)];
      votes2[seat]=v;
      await emit({phase:"vote",type:"private",actor:seat,visibility:[seat],display:{icon:"vote",title:"投票",text:`你投给了 ${v} 号。`},thinking:res.thinking,payload:{vote:v,offline:res.offline}});
    }
    const tally2={}; Object.values(votes2).forEach(v=>{ tally2[v]=(tally2[v]||0)+1; });
    let top2=[]; let max2=0;
    for(const t in tally2){ if(tally2[t]>max2){ max2=tally2[t]; top2=[parseInt(t)]; } else if(tally2[t]===max2){ top2.push(parseInt(t)); } }
    await emit({phase:"vote",type:"broadcast",actor:null,visibility:"all",display:{icon:"vote",title:"PK结果",text:voteSummary(votes2,tally2)},thinking:null,payload:{votes:votes2,tally:tally2}});
    if(top2.length>1){
      await emit({phase:"vote",type:"broadcast",actor:null,visibility:"all",display:{icon:"alert",title:"无放逐",text:"再次平票，当天无人被放逐。",card:"system"},thinking:null,payload:{}});
      return;
    }
    await exileSettle(top2[0]);
  } else {
    await exileSettle(top[0]);
  }
}

function voteSummary(votes,tally){
  const cands=Object.keys(tally).map(Number).sort((a,b)=>a-b);
  return cands.map(t=>`${t}号：${tally[t]}票`).join(" · ");
}

function showVoteBoard(votes,tally,top){
  if(game.meta.mode==="play" && currentView!=="god") return; // 仅上帝/公开
  let html=`<div class="handle"></div><h3>第 ${game.day} 天投票结果</h3>`;
  const cands=Object.keys(tally).map(Number).sort((a,b)=>b-a).sort((a,b)=>tally[b]-tally[a]);
  html += cands.map(t=>{
    const p=getPlayer(t); const voters=Object.keys(votes).filter(v=>votes[v]===t).map(Number);
    return `<div class="vote-candidate ${top.includes(t)?'winner':''}">
      <div class="seat-av">${p.avatar?'<img src="'+p.avatar+'">':icon("user")}</div>
      <div class="grow"><b>${t}号 ${esc(p.name)}</b>${top.includes(t)?' <span class="muted">· 放逐</span>':''}
      <div class="muted" style="font-size:11px;">${voters.length? voters.map(v=>v+"号").join("、"):"无票"}</div></div>
      <div class="dots">${voters.map(v=>'<span class="dot"></span>').join("")}</div>
    </div>`;
  }).join("");
  html+=`<button class="btn mt16" onclick="closeSheet()">关闭</button>`;
  openSheet(html); paintIcons(document.querySelector("#modal"));
}

async function exileSettle(seat){
  const p=getPlayer(seat); if(!p) return;
  game.currentActor=seat;
  const cause="exile";
  // 白痴翻牌
  if(p.role==="idiot"){
    game.flags.idiotRevealed.push(seat); game.flags.noVoteRights.push(seat); p.revealed=true;
    await emit({phase:"vote",type:"skill",actor:seat,visibility:"all",display:{icon:"bell",title:"白痴",text:`${seat}号是白痴，翻牌免死，失去投票权。`,card:""},thinking:null,payload:{}});
    checkWin(); return;
  }
  markDeath(seat,cause,null);
  p.revealed=true;
  await revealPlayer(seat);
  // 遗言
  if(p.isHuman){
    const r=await act(p,"last_words",{});
    await emit({phase:"vote",type:"broadcast",actor:seat,visibility:"all",display:{icon:"quill",title:"遗言",text:r.json.last_words||"过。"},thinking:r.thinking,payload:{last_words:r.json.last_words,offline:r.offline}});
  } else {
    const r=await act(p,"last_words",{});
    await emit({phase:"vote",type:"broadcast",actor:seat,visibility:"all",display:{icon:"quill",title:"遗言",text:r.json.last_words||"过。"},thinking:r.thinking,payload:{last_words:r.json.last_words,offline:r.offline}});
  }
  // 猎人开枪
  if(p.role==="hunter"){
    await hunterShoot(seat,"exile");
    if(game.winner!=null) return;
  }
  // 炸弹师爆炸
  if(p.role==="bomber"){
    const voters=Object.values(game.votes||{}).map(Number); // 本轮最终投票给炸弹师者
    // 需要精确：投给炸弹师的玩家。用最后一次投票的 votes。
    const bombVoters=[]; 
    // 找最后投票快照
    const lastVoteStep=[...game.history].reverse().find(s=>s.type==="broadcast"&&s.display&&s.display.title==="投票结果"||s.display&&(s.display.title==="PK结果"));
    const vt=lastVoteStep?lastVoteStep.payload.votes:{};
    for(const v in vt){ if(vt[v]===seat) bombVoters.push(parseInt(v)); }
    await emit({phase:"vote",type:"skill",actor:seat,visibility:"all",display:{icon:"bomb",title:"炸弹师",text:`炸弹师爆炸！${bombVoters.length?bombVoters.map(s=>s+"号").join("、")+" 出局":"无玩家被炸"}`},thinking:null,payload:{bombVoters}});
    for(const v of bombVoters){
      markDeath(v,"bomb",seat); getPlayer(v).revealed=true; await revealPlayer(v);
    }
  }
  // 殉情链（放逐导致的情侣殉情）
  const extra = expandCoupleSuicide([{seat,cause:"exile"}]).filter(d=>d.seat!==seat);
  for(const d of extra){ await emit({phase:"vote",type:"skill",actor:d.seat,visibility:"all",display:{icon:"broken_heart",title:"殉情",text:`${d.seat}号随 ${seat} 号殉情。`},thinking:null,payload:{}}); await revealPlayer(d.seat); }
  // 隐狼检查
  const hw=hiddenWolfCheck();
  if(hw){ await emit({phase:"vote",type:"reveal",actor:hw.seat,visibility:"all",display:{icon:"mask",title:"隐狼",text:`${hw.seat}号（隐狼）自动出局。`},thinking:null,payload:{}}); await revealPlayer(hw.seat); }
  checkWin();
}

/* ---- 结束与结算 ---- */
async function finishGame(){
  game.phase="over";
  const winnerTxt={good:"好人阵营获胜",wolf:"狼人阵营获胜",third:"第三方阵营获胜",draw:"平局"}[game.winner]||"平局";
  game.currentActor=null; game.currentSpeaker=null; game.centerMain=winnerTxt;
  await emit({phase:"over",type:"judge",actor:null,visibility:"all",display:{icon:"trophy",title:"游戏结束",text:`游戏结束：${winnerTxt}`,card:"system"},thinking:null,payload:{winner:game.winner}});
  // 档案出场计数
  game.players.forEach(p=>{
    if(!p.isHuman && p.characterId && p.characterId!=="user"){
      const c=characters.find(x=>x.id===p.characterId); if(c){ c.usedCount=(c.usedCount||0)+1; c.lastUsedAt=Date.now(); }
    }
  });
  saveCharacters();
  // 快照
  const snapshot={ players:game.players.map(p=>({seat:p.seat,name:p.name,avatar:p.avatar,role:p.role,faction:p.faction,alive:p.alive})),
    couple:game.couple, thirdParty:game.thirdParty, winner:game.winner, history:game.history, playerCount:game.playerCount };
  const item={id:"h_"+Date.now(), endTime:Date.now(), mode:game.meta.mode, playerCount:game.playerCount,
    result:game.winner, boardSummary:game.players.map(p=>p.role), snapshot};
  historyList.unshift(item); if(historyList.length>10) historyList=historyList.slice(0,10); saveHistory();
  store.remove(KEYS.save);
  renderResult();
  showScreen("screen-result");
}

let replayState=null;
function startReplay(history, players, playerCount, winner){
  game={ meta:{mode:"spectate"}, playerCount, players:players.map(p=>Object.assign({},p,{isHuman:false,revealed:true})),
    day:99, phase:"over", history, stepIndex:history.length, winner, flags:{idiotRevealed:[],noVoteRights:[]},
    centerMain:"", currentActor:null, currentSpeaker:null, apiStats:{calls:0,estTokens:0} };
  replayState={idx:history.length-1, len:history.length, playing:false};
  currentView="god"; showScreen("screen-game"); $("game-view").value="god";
  renderReplay();
}
function renderReplay(){
  const g=game, rs=replayState; if(!g||!rs) return;
  updateTopBar(); renderTable();
  const saved=g.history; g.history=rs? saved.slice(0,rs.idx+1) : saved; renderEventStream(); g.history=saved;
  const bar=$("action-bar");
  bar.innerHTML=`<div class="row">
    <button class="btn" id="rp-prev">${icon("back","sm")}</button>
    <button class="btn primary" id="rp-play">${icon(rs.playing?"pause":"play","sm")}</button>
    <button class="btn" id="rp-next">${icon("forward","sm")}</button></div>
    <div class="hint">第 ${rs.idx+1}/${rs.len} 步</div>`;
  $("rp-prev").onclick=()=>{ rs.playing=false; rs.idx=Math.max(0,rs.idx-1); renderReplay(); };
  $("rp-next").onclick=()=>{ rs.playing=false; rs.idx=Math.min(rs.len-1,rs.idx+1); renderReplay(); };
  $("rp-play").onclick=()=>{ rs.playing=!rs.playing; renderReplay(); if(rs.playing) replayAuto(); };
}
function replayAuto(){ if(replayState && replayState.playing && replayState.idx<replayState.len-1){ replayState.idx++; renderReplay(); setTimeout(replayAuto, settings.autoPlayInterval||1500); } else if(replayState){ replayState.playing=false; renderReplay(); } }

/* ---- 导出记录 ---- */
function exportRecord(){
  if(!game || !game.history.length){ toast("无记录可导出"); return; }
  const lines=game.history.map(s=>{
    const d=s.display||{};
    const who=s.actor? (getPlayer(s.actor)?`${getPlayer(s.actor).seat}号·${getPlayer(s.actor).name}`:"") : "系统";
    const vis=s.visibility==="wolves"?"[狼队]":(s.type==="private"?"[私密]":"");
    return `[第${s.day}天·${s.phase}]${vis} ${who} ${d.title||""}：${(s.payload&&s.payload.speech)||d.text||""}`;
  });
  downloadBlob(lines.join("\n"),`ai-werewolf-记录-${Date.now()}.txt`,"text/plain");
  const json=JSON.stringify({winner:game.winner,players:game.players.map(p=>({seat:p.seat,name:p.name,role:p.role,faction:p.faction,alive:p.alive})),history:game.history},null,2);
  downloadBlob(json,`ai-werewolf-数据-${Date.now()}.json`,"application/json");
  toast("已导出 TXT + JSON");
}
function downloadBlob(text,name,type){
  const b=new Blob([text],{type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function exportCharacters(){
  const b=new Blob([JSON.stringify(characters,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="ai-werewolf-characters.json"; a.click();
}

/* ---- 存档 ---- */
function saveGame(){
  if(!game) return;
  try{
    let s=JSON.stringify(game);
    if(s.length>4e6){
      const g2=JSON.parse(s); g2.players.forEach(p=>{ p.memory=p.memory.slice(-16); });
      g2.history.forEach(h=>{ h.thinking=null; });
      s=JSON.stringify(g2);
    }
    localStorage.setItem(KEYS.save,s);
  }catch(e){}
}
function hasSave(){ return !!localStorage.getItem(KEYS.save); }
function resumeGame(){
  const raw=localStorage.getItem(KEYS.save); if(!raw) return;
  let g; try{ g=JSON.parse(raw); }catch(e){ return; }
  game=g;
  if(game.winner!=null){ renderResult(); showScreen("screen-result"); return; }
  showScreen("screen-game");
  currentView = game.meta.mode==="play" ? ((game.players.find(p=>p.isHuman)||{}).seat||"god") : "god";
  renderTable(); renderEventStream(); updateTopBar();
  runGameLoop();
}

async function generateCharacter(){
  const cfg=settings.globalAPI;
  if(!cfg.apiKey){ toast("请先在设置中配置 API"); return; }
  const tagTxt=selectedTags.join("、")||"（无）";
  $("ce-generate").disabled=true; $("ce-generate").textContent="生成中...";
  try{
    const body={model:cfg.model,messages:[{role:"user",content:`请为狼人杀游戏生成一个虚拟玩家角色。方向标签：${tagTxt}。要求：角色有鲜明记忆点，性格会真实影响发言风格。只输出 JSON：{"name":"2-4字昵称","personality":"80-150字性格与说话方式描述"}`}],temperature:1.0,max_tokens:300,stream:false};
    const resp=await fetchJSON(cfg,body);
    if(resp.ok){
      const c2=resp.data.choices&&resp.data.choices[0]&&resp.data.choices[0].message;
      const p=parseJSON(c2?c2.content:""); if(p){ $("ce-name").value=p.name||""; $("ce-personality").value=p.personality||""; $("ce-pcount").textContent=(p.personality||"").length; toast("已生成，可编辑后保存"); }
      else toast("生成解析失败，请手动填写");
    } else toast("生成失败："+(resp.status||"网络错误"));
  }catch(e){ toast("生成失败"); }
  $("ce-generate").disabled=false; $("ce-generate").textContent="生成";
}
async function testConnection(baseUrl,apiKey,model,outEl){
  if(!apiKey){ outEl.textContent="请先填写 API Key"; return; }
  if(!model){ outEl.textContent="请填写模型名称"; return; }
  outEl.textContent="测试中...";
  const base=(baseUrl||"https://api.deepseek.com").replace(/\/+$/,"");
  try{
    const r=await fetch(base+"/chat/completions",{method:"POST",headers:{"Authorization":"Bearer "+apiKey,"Content-Type":"application/json"},body:JSON.stringify({model,messages:[{role:"user",content:"只回复两个字：收到"}],max_tokens:20,stream:false})});
    if(!r.ok){
      let msg="";
      try{ const d=await r.json(); msg=(d&&d.error&&(d.error.message||d.error.code))||(d&&d.message)||""; }catch(e){}
      outEl.textContent=`失败(${r.status})${msg?"："+msg:""}`;
      return;
    }
    let d=null; try{ d=await r.json(); }catch(e){ outEl.textContent="已连通，但返回内容不是有效 JSON"; return; }
    const c=d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
    const rm=(d&&d.model)||model;
    if(!c || !String(c).trim()){
      outEl.textContent=`已连通 ${rm}，但未返回文本（该模型可能不支持 chat/completions）`;
    } else {
      outEl.textContent=`已连通：${rm}（返回“${String(c).trim().slice(0,10)}”）`;
    }
  }catch(e){
    outEl.textContent="网络/CORS 错误：浏览器无法直连该接口，请更换支持 CORS 的接口";
  }
}
